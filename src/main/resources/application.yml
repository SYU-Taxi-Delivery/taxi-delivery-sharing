spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/taxi_delivery_sharing?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:capstone}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 16
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  error:
    include-message: never
    include-stacktrace: never
app:
  mail:
    # Render's free web services block outbound SMTP (25/465/587), so the deployment sends mail
    # through Brevo's HTTPS API (#51). Leave BREVO_API_KEY unset to keep using SMTP (spring.mail.*).
    brevo:
      api-key: ${BREVO_API_KEY:}
      base-url: https://api.brevo.com
      timeout: 5s
    # Sender address verified in Brevo. Required when BREVO_API_KEY is set.
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:택시·배달 합승}
